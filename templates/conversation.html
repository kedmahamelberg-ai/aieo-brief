{% macro conversation(item, anchor='conversation') %}
<section id="{{ anchor }}" class="conversation" data-key="{{ item.key }}"><h2>What is your take?</h2><p>Ask a question, add useful context or share a different perspective. Keep the conversation respectful and grounded.</p><p data-community-status class="small-copy" role="status"></p><div data-comments-list></div><button class="button secondary" data-action="account" data-comment-signin>Sign in to comment</button>
<form data-comment-form class="comment-form" hidden><label>Your public name<input name="display_name" minlength="2" maxlength="40" required autocomplete="nickname"></label><label>Your comment<textarea name="body" minlength="10" maxlength="2000" required placeholder="What would help you understand this story better?"></textarea></label><input type="hidden" name="parent_id"><p data-reply-context hidden></p><button class="button" type="submit">Submit comment</button><p class="small-copy">Comments are checked before appearing. Your email is never shown.</p><p data-comment-status role="status"></p></form>
</section>
{% endmacro %}
