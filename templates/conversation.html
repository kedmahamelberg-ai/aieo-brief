<section id="conversation" class="conversation" data-key="{{ story.key }}"><h2>What is your take?</h2><p>Ask a question, add useful context or share a different perspective. Keep the conversation respectful and grounded.</p><p id="community-status" class="small-copy" role="status"></p><div id="comments-list"></div><button class="button secondary" data-action="account" id="comment-signin">Sign in to comment</button>
<form id="comment-form" class="comment-form" hidden><label>Your public name<input name="display_name" minlength="2" maxlength="40" required autocomplete="nickname"></label><label>Your comment<textarea name="body" minlength="10" maxlength="2000" required placeholder="What would help you understand this story better?"></textarea></label><input type="hidden" name="parent_id"><p id="reply-context" hidden></p><button class="button" type="submit">Submit comment</button><p class="small-copy">Comments are checked before appearing. Your email is never shown.</p><p id="comment-status" role="status"></p></form>
</section>
