name: Brief PR regression tests
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Test editorial, release, privacy and site behavior
        run: |
          AIEO_AI_PROVIDER=local python -m unittest discover -s tests -p 'test_*.py'
          node --test tests/core.test.js tests/news-worker.test.js tests/monetization.test.js tests/carousels.test.js tests/ux-history.test.js tests/public-metrics.test.js
