name: Evaluate Editorial Grounding
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      AIEO_AI_PROVIDER: openai
      AIEO_AI_MAX_JOB_USD: '0.50'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: AIEO_AI_PROVIDER=local python -m unittest discover -s tests -p 'test_claim_grounding.py' -v
      - run: python scripts/evaluate_grounding.py
