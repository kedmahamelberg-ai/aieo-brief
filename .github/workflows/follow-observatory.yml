name: Follow Observatory Editions
on:
  schedule:
    - cron: '41 * * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: brief-observatory-handoff
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      needs_update: ${{ steps.edition.outputs.needs_update }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Compare the two published editions
        id: edition
        env:
          BRIEF_SITE_URL: ${{ vars.BRIEF_SITE_URL }}
        run: python scripts/check_observatory_update.py
  editorial:
    needs: check
    if: needs.check.outputs.needs_update == 'true'
    uses: ./.github/workflows/generate-brief-editorial.yml
    with:
      news_only: true
    secrets: inherit
  publish:
    needs: [check, editorial]
    # A failed draft must not hide valid new source links. The build still
    # rejects incomplete or mismatched Observatory release data itself.
    if: always() && needs.check.outputs.needs_update == 'true' && needs.editorial.result != 'cancelled'
    uses: ./.github/workflows/build-brief-preview.yml
    secrets: inherit
