name: Follow Observatory Editions
on:
  schedule:
    - cron: '41 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/editorial_engine.py'
      - 'scripts/news_reading.py'
      - 'data/editorial/news-seeds.json'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: brief-observatory-handoff
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      needs_update: ${{ steps.edition.outputs.needs_update }}
      needs_daily_refresh: ${{ steps.edition.outputs.needs_daily_refresh }}
      needs_weekly_review: ${{ steps.edition.outputs.needs_weekly_review }}
      needs_editorial_retry: ${{ steps.edition.outputs.needs_editorial_retry }}
      missing_news_summaries: ${{ steps.edition.outputs.missing_news_summaries }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Compare the two published editions
        id: edition
        env:
          BRIEF_SITE_URL: ${{ vars.BRIEF_SITE_URL }}
        run: python scripts/check_observatory_update.py
  editorial:
    needs: check
    if: needs.check.outputs.needs_update == 'true' || needs.check.outputs.needs_editorial_retry == 'true'
    uses: ./.github/workflows/generate-brief-editorial.yml
    with:
      news_only: true
      # Complete pending source-ready news within the existing time, request
      # and spending caps; saved checkpoints resume on later wake-ups.
      news_limit: '0'
    secrets: inherit
  publish:
    needs: [check, editorial]
    # Build after the writer has saved accepted articles and its checkpoint,
    # including partial success when another draft failed source review.
    if: always() && needs.check.result == 'success' && (needs.check.outputs.needs_update == 'true' || needs.check.outputs.needs_daily_refresh == 'true' || needs.check.outputs.needs_weekly_review == 'true' || needs.check.outputs.needs_editorial_retry == 'true')
    uses: ./.github/workflows/build-brief-preview.yml
    secrets: inherit
