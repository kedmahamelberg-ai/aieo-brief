name: Update Brief Daily Culture
on:
  schedule:
    - cron: '25 5 * * *'
    - cron: '25 17 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: brief-daily-culture
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install requests==2.32.5
      - uses: actions/cache@v4
        with:
          path: .cache/culture
          key: brief-culture-sources-v1-${{ github.run_id }}
          restore-keys: brief-culture-sources-v1-
      - name: Select today's art, poem, reading, quotation and music
        id: culture
        continue-on-error: true
        run: python -u scripts/collect_daily_culture.py
      - name: Keep valid selections and source status
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for directory in data/culture assets/culture; do
            if [[ -d "$directory" ]]; then git add -A "$directory"; fi
          done
          if ! git diff --cached --quiet; then
            git commit -m 'Publish attributed daily culture selection'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Report an incomplete selection for automatic retry
        if: steps.culture.outcome == 'failure'
        run: |
          echo '::error::A culture source was unavailable. Valid selections were retained. The next scheduled pass retries missing items only.'
          exit 1
