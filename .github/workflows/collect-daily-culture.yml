name: Update Brief Daily Culture
on:
  schedule:
    - cron: '25 3 * * *'
    - cron: '25 15 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: brief-daily-culture
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Select today's five works from the stored collection
        id: culture
        run: python -u scripts/collect_daily_culture.py
      - name: Propose the daily selection
        uses: peter-evans/create-pull-request@v8
        with:
          add-paths: |
            data/culture/current.json
            data/culture/status.json
          branch: automation/brief-daily-culture
          branch-suffix: timestamp
          sign-commits: true
          commit-message: Publish attributed daily culture selection
          title: Publish attributed daily culture selection
          body: |
            Automated daily selection. Review the five works and attribution before merging.
