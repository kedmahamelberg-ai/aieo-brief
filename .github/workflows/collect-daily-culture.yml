name: Update Brief Daily Culture
on:
  schedule:
    - cron: '25 3 * * *'
    - cron: '25 15 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: brief-daily-culture
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Select today's five works from the stored collection
        id: culture
        run: python -u scripts/collect_daily_culture.py
      - name: Preserve the daily selection
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/culture/current.json data/culture/status.json
          if ! git diff --cached --quiet; then
            git commit -m 'Publish attributed daily culture selection'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
