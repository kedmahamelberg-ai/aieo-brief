name: Prepare Weekly Brief Review
on:
  # The Observatory dispatches Follow Observatory Editions after its weekly
  # release is published. Do not prepare the same weekly review after each
  # daily Brief news update or during hourly handoff checks.
  workflow_run:
    workflows: ['Follow Observatory Editions']
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: brief-weekly-review
  cancel-in-progress: false
jobs:
  prepare:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.event == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      AIEO_AI_PROVIDER: ${{ vars.AIEO_AI_PROVIDER || 'openai' }}
      AIEO_AI_MAX_JOB_USD: ${{ vars.AIEO_AI_MAX_JOB_USD || '0.50' }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Prepare review-only weekly overview
        run: python scripts/prepare_weekly_review.py
      - name: Keep the review for human approval
        uses: actions/upload-artifact@v4
        with:
          name: weekly-review-${{ github.run_id }}
          path: weekly-review-draft.json
          retention-days: 30
