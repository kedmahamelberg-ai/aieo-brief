name: Verify Both Live Weekly Editions
on:
  schedule:
    - cron: '11 21 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Check live dates, counts and classifications on both websites
        env:
          BRIEF_SITE_URL: ${{ vars.BRIEF_SITE_URL }}
        run: python scripts/check_observatory_update.py --require-current
