name: Prepare Social Approval Batch
on:
  workflow_call:
    inputs:
      website_artifact:
        type: string
        required: false
        default: ''
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: brief-social-production
  cancel-in-progress: false
jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install image renderer
        run: python -m pip install 'Pillow>=11,<13'
      - name: Read the exact website build that was deployed
        if: inputs.website_artifact != ''
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.website_artifact }}
          path: deployed-site
      - name: Check edition identity and durable deduplication state
        id: readiness
        env:
          EXPECTED_ITEMS: ${{ inputs.website_artifact != '' && 'deployed-site/data/public-items.json' || '' }}
        run: python scripts/prepare_social_review.py --check-only
      - name: Produce the complete review-only social package
        if: steps.readiness.outputs.needed == 'true'
        env:
          EXPECTED_ITEMS: ${{ inputs.website_artifact != '' && 'deployed-site/data/public-items.json' || '' }}
        run: python scripts/prepare_social_review.py
      - name: Keep the approval package and diagnostic partial work
        id: artifact
        if: always() && steps.readiness.outputs.needed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: social-review-${{ github.run_id }}-${{ github.run_attempt }}
          path: social-review
          if-no-files-found: error
          retention-days: 90
      - name: Authorize the production receipt
        if: success() && steps.readiness.outputs.needed == 'true'
        uses: ./.github/actions/authorize-publisher
        with:
          private-key: ${{ secrets.SCHEDULED_PUBLISHER_PRIVATE_KEY }}
      - name: Save completed edition and permanent photo history
        if: success() && steps.readiness.outputs.needed == 'true'
        env:
          SOCIAL_ARTIFACT_URL: ${{ steps.artifact.outputs.artifact-url }}
        run: |
          python scripts/prepare_social_review.py --record
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/social-production/state.json config/social-photo-history.json
          git commit -m 'Record draft social production and photograph history [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
          printf '\nReview package: %s\n' "$SOCIAL_ARTIFACT_URL" >> "$GITHUB_STEP_SUMMARY"
