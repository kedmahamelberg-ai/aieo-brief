name: Update Brief News and Research
on:
  schedule:
    - cron: '15 12 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Check pending work without starting the model
        type: boolean
        default: false
      news_minutes:
        description: Maximum minutes for news this pass (1 to 105)
        type: string
        default: '45'
      research_minutes:
        description: Maximum minutes for research this pass (1 to 60)
        type: string
        default: '15'
permissions:
  contents: write
concurrency:
  group: brief-generation
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 200
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      OBSERVATORY_BASE_URL: https://observatory.hamelberg-ai.com
      BRIEF_EDITORIAL_MODEL_REVISION: ggml-org/Qwen3-4B-GGUF@2f3b082b1356a6123f7ed71e65aea340da25d53c
      BRIEF_LOCAL_LLM_URL: http://127.0.0.1:8080
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Check release and pending news before loading the model
        id: news
        continue-on-error: true
        run: python scripts/generate_editorial_stories.py --dry-run
      - name: Check research published in the last seven days
        id: collect
        continue-on-error: true
        run: python scripts/collect_research.py
      - name: Check pending research
        id: research
        if: steps.collect.outcome == 'success'
        run: python scripts/generate_research_summaries.py --dry-run
      - name: Start the local model only when there is new evidence
        id: model
        if: inputs.dry_run != true && (steps.news.outputs.needs_model == 'true' || steps.research.outputs.needs_model == 'true')
        uses: ./.github/actions/local-editorial-model
      - name: Write and save news one story at a time
        id: write_news
        if: inputs.dry_run != true && steps.news.outcome == 'success'
        continue-on-error: true
        env:
          NEWS_MINUTES: ${{ inputs.news_minutes || '45' }}
        run: python scripts/generate_editorial_stories.py --max-runtime-minutes "$NEWS_MINUTES"
      - name: Write research with its study limits
        id: write_research
        if: inputs.dry_run != true && steps.collect.outcome == 'success'
        continue-on-error: true
        env:
          RESEARCH_MINUTES: ${{ inputs.research_minutes || '15' }}
        run: python scripts/generate_research_summaries.py --max-runtime-minutes "$RESEARCH_MINUTES"
      - name: Retain public summaries and resumable progress
        if: always() && inputs.dry_run != true
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for file in data/editorial/retry-state.json data/editorial/status.json data/research/public.json data/research/collection-status.json data/research/generation-status.json data/research/retry-state.json; do
            if [[ -f "$file" ]]; then git add "$file"; fi
          done
          if ! git diff --cached --quiet; then
            git commit -m 'Update Brief source summaries and progress'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Retain private research provenance briefly
        if: always() && inputs.dry_run != true && github.event.repository.private == true
        uses: actions/upload-artifact@v4
        with:
          name: private-research-validation-${{ github.run_id }}
          path: data/research/private/validation.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Stop local model
        if: always()
        shell: bash
        run: |
          if [[ -f llama-server.pid ]]; then kill "$(cat llama-server.pid)" 2>/dev/null || true; fi
      - name: Report incomplete automatic drafts
        if: always() && (steps.news.outcome == 'failure' || steps.write_news.outcome == 'failure' || steps.write_research.outcome == 'failure' || steps.collect.outcome == 'failure')
        run: |
          echo '::error::Some sources or drafts need another automatic pass. Saved valid summaries and original source links are preserved.'
          exit 1
