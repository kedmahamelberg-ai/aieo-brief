name: Update Brief Government AI Announcements
on:
  schedule:
    # 16:05 Amsterdam in summer/winter; the local gate rejects the early winter wake-up.
    - cron: '5 14,15 * * *'
    # Retry delayed/missed daily triggers without importing twice on the same day.
    - cron: '35 * * * *'
    # Explicit checks after the 09:00 and 15:00 Amsterdam Monitor passes.
    # Paired UTC wakes keep 10:15 and 16:45 local time across daylight saving.
    - cron: '15 8 * * *'
    - cron: '15 9 * * *'
    - cron: '45 14 * * *'
    - cron: '45 15 * * *'
  workflow_run:
    workflows: ['Build and Publish AIEO Brief']
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      force_refresh:
        description: Refresh the corrected Monitor feed even if today's import already ran
        required: false
        type: boolean
        default: false
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: brief-government-announcements
  cancel-in-progress: false
jobs:
  collect:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    outputs:
      publish: ${{ steps.saved.outputs.changed }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Check whether today's Amsterdam import is due
        id: daily
        run: python3 scripts/government_brief_schedule.py --check-feed ${{ inputs.force_refresh && '--force' || '' }}
      - uses: actions/setup-python@v6
        if: steps.daily.outputs.due == 'true'
        with:
          python-version: '3.12'
          cache: pip
      - if: steps.daily.outputs.due == 'true'
        run: python -m pip install -r requirements.txt
      - name: Verify Monitor AI label import, corrections and deduplication
        if: steps.daily.outputs.due == 'true'
        run: python -m unittest discover -s tests -p 'test_government_briefs.py' -v
      - name: Count pending Monitor AI narratives
        if: steps.daily.outputs.due == 'true'
        run: python scripts/government_briefs.py --dry-run
      - name: Import AI-labelled Monitor narratives
        if: steps.daily.outputs.due == 'true'
        run: python scripts/government_briefs.py
      - name: Authorize the Monitor import
        if: steps.daily.outputs.due == 'true'
        uses: ./.github/actions/authorize-publisher
        with:
          private-key: ${{ secrets.SCHEDULED_PUBLISHER_PRIVATE_KEY }}
      - name: Preserve imported Monitor narratives
        id: saved
        if: steps.daily.outputs.due == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if [[ -f data/governments/public.json ]]; then
            git add data/governments/public.json
            if ! git diff --cached --quiet; then
              git commit -m 'Import Monitor AI narratives'
              git pull --rebase origin main
              git push origin HEAD:main
              echo 'changed=true' >> "$GITHUB_OUTPUT"
            fi
          fi
  publish:
    needs: collect
    # Publisher commits intentionally carry [skip ci]; publish the saved data explicitly.
    if: always() && needs.collect.outputs.publish == 'true' && needs.collect.result != 'cancelled'
    uses: ./.github/workflows/build-brief-preview.yml
    secrets: inherit
  verify:
    needs: [collect, publish]
    if: always() && needs.collect.result == 'success' && (needs.publish.result == 'success' || needs.publish.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Select Amsterdam parity checkpoint
        id: slot
        env:
          GITHUB_EVENT_SCHEDULE: ${{ github.event.schedule }}
          IMPORT_CHANGED: ${{ needs.collect.outputs.publish }}
        run: python3 scripts/government_brief_schedule.py --verify-slot
      - uses: actions/setup-python@v6
        if: steps.slot.outputs.verify == 'true'
        with:
          python-version: '3.12'
          cache: pip
      - if: steps.slot.outputs.verify == 'true'
        run: python -m pip install -r requirements.txt
      - name: Compare Monitor eligibility, saved import and live Brief cards
        if: steps.slot.outputs.verify == 'true'
        env:
          BRIEF_SITE_URL: ${{ vars.BRIEF_SITE_URL }}
        run: python scripts/verify_live_government_coverage.py
