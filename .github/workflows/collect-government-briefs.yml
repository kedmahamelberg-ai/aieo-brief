name: Update Brief Government AI Announcements
on:
  schedule:
    # 16:05 Amsterdam in summer/winter; the local gate rejects the early winter wake-up.
    - cron: '5 14,15 * * *'
    # Retry delayed/missed daily triggers without importing twice on the same day.
    - cron: '35 * * * *'
  workflow_dispatch:
    inputs:
      force_refresh:
        description: Refresh the corrected Monitor feed even if today's import already ran
        required: false
        type: boolean
        default: false
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: brief-government-announcements
  cancel-in-progress: false
jobs:
  collect:
    outputs:
      publish: ${{ steps.saved.outputs.changed }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Check whether today's Amsterdam import is due
        id: daily
        run: python3 scripts/government_brief_schedule.py ${{ inputs.force_refresh && '--force' || '' }}
      - uses: actions/setup-python@v6
        if: steps.daily.outputs.due == 'true'
        with:
          python-version: '3.12'
          cache: pip
      - if: steps.daily.outputs.due == 'true'
        run: python -m pip install -r requirements.txt
      - name: Verify Monitor AI label import, corrections and deduplication
        if: steps.daily.outputs.due == 'true'
        run: python -m unittest discover -s tests -p 'test_government_briefs.py' -v
      - name: Count pending Monitor AI narratives
        if: steps.daily.outputs.due == 'true'
        run: python scripts/government_briefs.py --dry-run
      - name: Import AI-labelled Monitor narratives
        if: steps.daily.outputs.due == 'true'
        run: python scripts/government_briefs.py
      - name: Authorize the Monitor import
        if: steps.daily.outputs.due == 'true'
        uses: ./.github/actions/authorize-publisher
        with:
          private-key: ${{ secrets.SCHEDULED_PUBLISHER_PRIVATE_KEY }}
      - name: Preserve imported Monitor narratives
        id: saved
        if: steps.daily.outputs.due == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if [[ -f data/governments/public.json ]]; then
            git add data/governments/public.json
            if ! git diff --cached --quiet; then
              git commit -m 'Import Monitor AI narratives'
              git pull --rebase origin main
              git push origin HEAD:main
              echo 'changed=true' >> "$GITHUB_OUTPUT"
            fi
          fi
  publish:
    needs: collect
    # Publisher commits intentionally carry [skip ci]; publish the saved data explicitly.
    if: always() && needs.collect.outputs.publish == 'true' && needs.collect.result != 'cancelled'
    uses: ./.github/workflows/build-brief-preview.yml
    secrets: inherit
