name: Repair W48 Social Photo Review

on:
  push:
    branches:
      - codex/w48-photo-repair
    paths:
      - .github/workflows/repair-w48-social-photos.yml
      - scripts/repair_social_photos.py
      - config/social-photo-scopes-2026-W47.json
      - config/social-photo-repair-2026-W48.json
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: brief-social-production
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - run: python -m pip install "Pillow>=11,<13" "requests>=2.32,<3"

      - name: Confirm the exact pending W48 artifact
        id: repair
        run: python scripts/repair_social_photos.py plan

      - uses: actions/download-artifact@v4
        if: steps.repair.outputs.needed == 'true'
        with:
          artifact-ids: ${{ steps.repair.outputs.artifact_id }}
          run-id: ${{ steps.repair.outputs.run_id }}
          github-token: ${{ github.token }}
          path: original-social-review
          merge-multiple: true

      - name: Replace only the audited photographs and derived media
        if: steps.repair.outputs.needed == 'true'
        run: python scripts/repair_social_photos.py produce

      - uses: actions/upload-artifact@v4
        id: artifact
        if: steps.repair.outputs.needed == 'true'
        with:
          name: social-review-${{ github.run_id }}-W48-revision-2
          path: social-review
          if-no-files-found: error
          retention-days: 90

      - name: Authorize the corrected draft receipt
        if: steps.repair.outputs.needed == 'true'
        uses: ./.github/actions/authorize-publisher
        with:
          private-key: ${{ secrets.SCHEDULED_PUBLISHER_PRIVATE_KEY }}

      - name: Preserve revision 1 and register revision 2 on the repair branch
        if: steps.repair.outputs.needed == 'true'
        env:
          SOCIAL_ARTIFACT_URL: ${{ steps.artifact.outputs.artifact-url }}
        run: |
          python scripts/repair_social_photos.py record
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/social-production config/social-photo-history.json
          git commit -m 'Register visually audited W48 social review revision 2 [skip ci]'
          git pull --rebase origin codex/w48-photo-repair
          git push origin HEAD:codex/w48-photo-repair
