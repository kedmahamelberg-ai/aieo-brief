name: Email Social Approval Batch
on:
  workflow_run:
    workflows: ['Build and Publish AIEO Brief', 'Prepare Social Approval Batch']
    types: [completed]
  # Deliver the current batch when this repair is installed, too.
  push:
    branches: [main]
    paths:
      - '.github/workflows/email-social-review.yml'
      - 'scripts/social_review_delivery.py'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: brief-social-email
  cancel-in-progress: false
jobs:
  email:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install review renderer and mail client
        run: python -m pip install 'Pillow>=11,<13' 'requests>=2.32,<3'
      - name: Find this week's completed batch that still needs email
        id: delivery
        run: python scripts/social_review_delivery.py plan
      - name: Download the completed social artifact
        if: steps.delivery.outputs.needed == 'true'
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ steps.delivery.outputs.artifact_id }}
          run-id: ${{ steps.delivery.outputs.run_id }}
          github-token: ${{ github.token }}
          path: social-review
          merge-multiple: true
      - name: Email the unapproved batch to its owner
        if: steps.delivery.outputs.needed == 'true'
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
          WEEKLY_REVIEW_TO_EMAIL: ${{ secrets.WEEKLY_REVIEW_TO_EMAIL }}
        run: python scripts/social_review_delivery.py send
      - name: Authorize the email delivery receipt
        if: steps.delivery.outputs.needed == 'true'
        uses: ./.github/actions/authorize-publisher
        with:
          private-key: ${{ secrets.SCHEDULED_PUBLISHER_PRIVATE_KEY }}
      - name: Preserve delivery receipt to prevent repeat emails
        if: steps.delivery.outputs.needed == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/social-production/email-receipts.json
          git commit -m 'Record owner social review email delivery [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
